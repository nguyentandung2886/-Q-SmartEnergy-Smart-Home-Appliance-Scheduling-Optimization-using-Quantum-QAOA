services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    # SQLite lives on a named volume so data survives container restarts.
    # DATABASE_URL in .env should point at sqlite:////app/data/q_smartenergy.db
    volumes:
      - api_data:/app/data
    ports:
      - "8000:8000"
    networks:
      - app-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-/api}"
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - app-net

volumes:
  api_data:

networks:
  app-net:
