server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ──────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml image/svg+xml;

    # ── Basic security headers ───────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy API calls to the FastAPI backend (same-origin → no CORS needed).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Stream Server-Sent Events (Gemini explanation) without buffering.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # React Router SPA: serve index.html for all unmatched paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}
