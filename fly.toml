# fly.toml app configuration file generated for q-smartenergy-api on 2026-07-03T20:43:20+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'q-smartenergy-api'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile.api'

[env]
  OPTIMIZATION_ALGORITHM = 'brute_force'
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 50
    soft_limit = 25

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
